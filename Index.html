<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAIO FOOD ⚡ Fast Delivery</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#f8f8ff}
header{background:linear-gradient(90deg,#ff4a8d,#7c3aed);padding:14px 18px;color:#fff;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:99}
.logo{width:36px;height:36px;background:#fff;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#7c3aed}
.search{padding:12px;background:#fff;display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 80px;padding:12px;border:1px solid #ddd;border-radius:12px}
.search button{padding:12px 18px;border:0;border-radius:12px;background:linear-gradient(90deg,#ff4a8d,#7c3aed);color:#fff;font-weight:700}
#map{height:280px;width:100%}
.list{padding:12px;display:grid;gap:12px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.card h3{font-size:16px}
.badge{background:#e7f7ee;color:#0a7a3e;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.links{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.links a{padding:8px 12px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:600}
.wa{background:#25d366;color:#fff}
.ig{background:linear-gradient(45deg,#feda75,#d62976,#962fbf);color:#fff}
.gmaps{background:#111;color:#fff}
footer{text-align:center;padding:20px;color:#888;font-size:12px}
</style>
</head>
<body>
<header><div class="logo">⚡</div><div><b>RAIO FOOD</b><br><small style="opacity:.9">Desenvolvido por Maicom Fonseca</small></div></header>
<div class="search">
<input id="estado" value="SP" placeholder="Estado">
<input id="cidade" value="Taboão da Serra" placeholder="Cidade">
<input id="bairro" value="Pirajuçara" placeholder="Bairro">
<button onclick="buscar()">BUSCAR ⚡</button>
<button onclick="usarGPS()">
