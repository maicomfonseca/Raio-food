<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAIO FOOD - Fast Food Real por Bairro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#1c1440;color:#fff}
header{background:#0f0a2a;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
header h1{color:#ffcc00;font-size:28px} header p{font-size:13px;opacity:.8}
.search{padding:15px;background:#251c5a;display:flex;gap:10px}
.search input{flex:1;padding:12px;border-radius:10px;border:none;outline:none}
.search button{padding:12px 15px;border:none;border-radius:10px;background:#ffcc00;font-weight:bold}
#map{height:350px;width:100%}
.lista{padding:15px;display:grid;gap:15px}
.card{background:#2a2165;border-radius:15px;padding:15px;display:flex;flex-direction:column;gap:8px}
.card h3{color:#ffcc00} .card .bairro{font-size:12px;opacity:.7}
.btns{display:flex;gap:10px;margin-top:5px}
.btn{flex:1;padding:10px;border-radius:8px;text-align:center;text-decoration:none;font-weight:bold;font-size:13px}
.wpp{background:#25D366;color:#fff} .insta{background:#E1306C;color:#fff}
footer{text-align:center;padding:20px;opacity:.5;font-size:11px}
</style>
</head>
<body>
<header>
<h1>⚡ RAIO FOOD</h1>
<p>Fast-food REAL por bairro - Taboão da Serra e região</p>
</header>

<div class="search">
<input id="busca" placeholder="Digite seu bairro: Ex: Pq. São Joaquim, Jd. Salete...">
<button onclick="filtrar()">Buscar</button>
</div>

<div id="map"></div>

<div class="lista" id="lista"></div>

<footer>Desenvolvido por Maicom Fonseca - Taboão da Serra - SP</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const empresas = [
{nome:"Hamburgueria do Pq. São Joaquim", bairro:"Pq. São Joaquim", lat:-23.628, lng:-46.787, whats:"5511999999999", insta:"hamburgueriateste"},
{nome:"Pastelaria Taboão Centro", bairro:"Centro", lat:-23.619, lng:-46.779, whats:"5511999999999", insta:"pasteis"},
{nome:"Lanches Jd. Salete", bairro:"Jd. Salete", lat:-23.635, lng:-46.791, whats:"5511999999999", insta:"lanches"},
];

let map = L.map('map').setView([-23.625,-46.785],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marcadores=[];

function mostrar(lista){
document.getElementById('lista').innerHTML='';
marcadores.forEach(m=>map.removeLayer(m)); marcadores=[];
lista.forEach(e=>{
let m=L.marker([e.lat,e.lng]).addTo(map).bindPopup(`<b>${e.nome}</b><br>${e.bairro}`);
marcadores.push(m);
document.getElementById('lista').innerHTML+=`
<div class="card">
<h3>${e.nome}</h3>
<span class="bairro">📍 ${e.bairro}</span>
<div class="btns">
<a class="btn wpp" href="https://wa.me/${e.whats}?text=Oi! Vi vocês no RAIO FOOD" target="_blank">WhatsApp</a>
<a class="btn insta" href="https://instagram.com/${e.insta}" target="_blank">Instagram</a>
</div>
</div>`;
});
}

function filtrar(){
let termo=document.getElementById('busca').value.toLowerCase();
if(!termo){mostrar(empresas);return;}
let f=empresas.filter(e=>e.bairro.toLowerCase().includes(termo) || e.nome.toLowerCase().includes(termo));
mostrar(f);
}

mostrar(empresas);
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(p=>{
let lat=p.coords.latitude, lng=p.coords.longitude;
L.marker([lat,lng],{icon:L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/64/64113.png',iconSize:[20,20]})}).addTo(map).bindPopup("Você está aqui");
});
}
</script>
</body>
</html>
