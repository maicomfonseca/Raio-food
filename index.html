<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAIO FOOD - Mapa de Restaurantes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
#header{background:#ff3b30;color:#fff;padding:15px;text-align:center;font-weight:bold;font-size:20px}
#map{height:400px;width:100%}
#lista{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;padding:12px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.card h3{margin:0 0 5px;font-size:16px}
.card p{margin:0;color:#555;font-size:13px}
.badge{background:#ff3b30;color:#fff;padding:2px 6px;border-radius:5px;font-size:11px}
</style>
</head>
<body>
<div id="header">🍔 RAIO FOOD - Lugares perto de você</div>
<div id="map"></div>
<div id="lista"></div>

<script>
const lugares = [
{nome:"Burger Pirajussara", endereco:"Av. Laurita Ortega Mari, 350 - Pirajussara", cat:"Lanches", lat:-23.6425, lng:-46.7912},
{nome:"Pastel da Feira", endereco:"Estrada de São Francisco, 1200", cat:"Pastel", lat:-23.6410, lng:-46.7900},
{nome:"Açaí do Ponto", endereco:"Rua José Mari, 85 - Pirajussara", cat:"Açaí", lat:-23.6435, lng:-46.7920},
{nome:"Pizza da Vila", endereco:"Rua João Batista, 200", cat:"Pizza", lat:-23.6400, lng:-46.7890},
{nome:"Esfiha Express", endereco:"Av. Cid. Nelson Jordano, 150", cat:"Esfihas", lat:-23.6440, lng:-46.7930},
{nome:"Churrasquinho Top", endereco:"Rua Miguel Carlos Silva, 42", cat:"Churrasco", lat:-23.6450, lng:-46.7940}
// COLE AQUI OS OUTROS 34 QUE VOCÊ JÁ TINHA, SÓ MANTENDO nome, endereco, cat, lat, lng
];

const map = L.map('map').setView([-23.6425, -46.7912], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const listaDiv = document.getElementById('lista');
lugares.forEach(l=>{
  L.marker([l.lat, l.lng]).addTo(map).bindPopup(`<b>${l.nome}</b><br>${l.endereco}`);
  listaDiv.innerHTML += `<div class="card"><h3>${l.nome}</h3><p><span class="badge">${l.cat}</span></p><p>📍 ${l.endereco}</p></div>`;
});
</script>
</body>
</html>
